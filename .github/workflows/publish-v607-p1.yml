name: Publish ShamiGo v0.10.607 packaging fix
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-v607-p1.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the public binary repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build sanitized archive and validate its contents
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, pathlib, re, shutil, subprocess, zipfile
          root = pathlib.Path.cwd()
          stage = root / "_public_stage"
          stage.mkdir()
          allowed_root = {
              "Install_Windows.cmd", "Run_Windows.cmd", "Uninstall_Windows.cmd",
              "Diagnose_Windows.cmd", "Install_Linux.sh", "Uninstall_Linux.sh",
              "Install_Linux_VM_from_Windows.cmd", "README.md", "VERSION.json",
              "LICENSE.md", "THIRD_PARTY_NOTICES.md",
          }
          tracked = subprocess.check_output(["git", "ls-files", "-z"]).split(b"\x00")
          selected = []
          for raw in tracked:
              if not raw:
                  continue
              rel = raw.decode("utf-8")
              if rel not in allowed_root and not rel.startswith(("Packages/", "Data/", "Docs/")):
                  continue
              if re.search(r"\.(tab|cin|box)$", rel, re.I):
                  raise SystemExit("Refusing to package licensed table: " + rel)
              if "/Projects/" in "/" + rel or "/Tools/Prepare_Windows_Data.ps1" in "/" + rel:
                  raise SystemExit("Unexpected private preparation source: " + rel)
              path = root / rel
              if not path.is_file() or path.is_symlink():
                  raise SystemExit("Invalid tracked release file: " + rel)
              if any(ord(ch) > 127 for ch in rel) or re.search(r"[^A-Za-z0-9_./ -]", rel):
                  raise SystemExit("Unsupported Windows ZIP member name: " + rel)
              target = stage / rel
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(path, target)
              selected.append(rel)
          mandatory = [
              "Packages/Windows/ShamiGo/ShamiGo.exe",
              "Packages/Windows/ShamiGo/ShamiGo_AdminSetup.exe",
              "Packages/Windows/ShamiGo/ShamiGo_AdminLauncher.exe",
              "Packages/Windows/ShamiGo/Tools/Configure_ShamiGo_AutoStart.ps1",
              "Packages/Windows/ShamiGo/Tools/Prepare_ECDICT.ps1",
              "Packages/Windows/ShamiGo/LicensedTables/README.txt",
              "Data/EnglishECDICT.tar.xz", "Data/EnglishChineseReverse.tar.xz",
              "VERSION.json", "Install_Windows.cmd", "Run_Windows.cmd",
          ]
          for rel in mandatory:
              if rel not in selected:
                  raise SystemExit("Missing release requirement: " + rel)
          meta = json.loads((stage / "VERSION.json").read_text(encoding="utf-8"))
          if meta["package"]["version"] != "0.10.607" or meta["windows"]["version"] != "0.10.607":
              raise SystemExit("Release version is inconsistent")
          manifest = stage / "FILE_SHA256SUMS.txt"
          manifest.write_text(
              "".join(hashlib.sha256((stage / rel).read_bytes()).hexdigest() + "  " + rel + "\n"
                      for rel in sorted(selected)),
              encoding="ascii",
          )
          archive = root / "ShamiGo_v0.10.607-p1_Public.zip"
          with zipfile.ZipFile(archive, "w", zipfile.ZIP_DEFLATED, compresslevel=6) as z:
              for rel in sorted(selected + ["FILE_SHA256SUMS.txt"]):
                  z.write(stage / rel, arcname=rel)
          with zipfile.ZipFile(archive) as z:
              if z.testzip() is not None:
                  raise SystemExit("Archive CRC verification failed")
              names = z.namelist()
              if len(names) != len(selected) + 1 or len(names) != len(set(n.lower() for n in names)):
                  raise SystemExit("Unexpected archive contents")
              lines = z.read("FILE_SHA256SUMS.txt").decode("ascii").splitlines()
              if len(lines) != len(selected):
                  raise SystemExit("Incomplete per-file checksums")
              for line in lines:
                  h, rel = line.split("  ", 1)
                  if hashlib.sha256(z.read(rel)).hexdigest() != h:
                      raise SystemExit("Archive SHA-256 mismatch: " + rel)
              for rel in names:
                  if re.search(r"\.(tab|cin|box)$", rel, re.I) or rel.startswith((".github/", "Projects/", "Tools/")):
                      raise SystemExit("Forbidden content in public ZIP: " + rel)
          sha = hashlib.sha256(archive.read_bytes()).hexdigest()
          (root / "SHA256SUMS.txt").write_text(sha + "  " + archive.name + "\n", encoding="ascii")
          print("Verified release:", archive.name, archive.stat().st_size, sha)
          PY

      - name: Publish corrected release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v0.10.607-p1 >/dev/null 2>&1; then
            gh release upload v0.10.607-p1 ShamiGo_v0.10.607-p1_Public.zip SHA256SUMS.txt --clobber
          else
            gh release create v0.10.607-p1 ShamiGo_v0.10.607-p1_Public.zip SHA256SUMS.txt \
              --target "$GITHUB_SHA" \
              --title "ShamiGo v0.10.607 (Windows installer repair p1)" \
              --notes "Repaired Windows public installation path, ZIP checksums and packaging metadata. No original application source or licensed Boshiamy tables are included. Install or run after extracting the ZIP and adding your legally obtained liu-uni.tab."
          fi
