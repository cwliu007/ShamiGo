; Compatibility/legacy profile. Native Windows v0.10.394 uses ShamiGoCPP.ini.
; Do not infer the native application defaults from this legacy file.
; ShamiGo / 蝦米GO portable settings
; Lines beginning with ; or # are comments. Unknown keys are ignored.
; Invalid numeric values safely fall back to defaults.

[ShamiGo]
; Returning to a previously focused input control restores its language/width state when enabled.
RememberPerInputField=true
; Legacy runtime fallback values. FullWidth is independent of Eng/中文.
Chinese=false
; Character width is independent of Eng/中文. false=half-width, true=full-width.
FullWidth=false
; T=中文, C=簡體, J=日文. QuickCodeMode uses the Traditional table.
TableMode=T
; Mode used every time ShamiGo starts: ENG, T=中文, C=簡體, J=日文, SP=快碼, PY=拼音, ZY=注音.
StartupMode=ENG
; Default is false (normal Traditional Chinese). true=快碼 mode.
QuickCodeMode=false
SaveStateOnExit=true

[Features]
; Ctrl+Alt+, quick symbols are always available. This key is retained for compatibility.
QuickSymbolsEnabled=true
; Reload ShamiGo.ini automatically after it is saved.
AutoReloadSettings=true
; Show nearby-code suggestions only after Space confirms a code that has no exact candidate.
; Suggestions can be chosen with 0-9 or the mouse.
FuzzySuggestionsEnabled=false
; Associated phrases are off by default. Enable this to show phrase suggestions after Chinese commits.
RelatedPhrasesEnabled=false
; Number of associated phrases on one horizontal page (1-10). Default: 10 (auto-reduced if screen space is insufficient).
RelatedPageSize=10
; Rare characters from licensed liuext.tab, off by default. May be used together with related phrases.
RareCharactersEnabled=false
; Number of rare candidates per result-panel page (1-10), default 3.

[Input]
; Ctrl+Space first group: ENG/T/C/J/SP/PY/ZY. Default: Eng <-> 中文.
; Ctrl-held Shift tap toggles the automatic second group. Example: ENG/PY -> ZY/T.
CtrlSpaceModeA=ENG
CtrlSpaceModeB=T
; Legacy compatibility: Shift+letter direct output is always enabled in non-English ShamiGo modes.
ShiftLetterDirectEnglish=true
; upper=大寫, lower=小寫. Default: upper.
ShiftLetterDirectCase=upper
; Legacy timing setting retained for compatibility. Shift does not toggle language.
; Holding Ctrl temporarily shows the current mode; releasing Ctrl hides it.
; Ctrl combinations such as Ctrl+C/Ctrl+V are not intercepted.
; Valid range: 200-2000 ms.
ShiftTapMaxMS=700
; Hold . , ' ` [ ] for >=160ms to send the half-width ASCII symbol once.
; Short presses keep original behavior. Range: 100-1500 ms (0.1-1.5 s).
LongPressSymbolMS=160

[UI]
; Position refresh interval. Valid range: 40-1000 ms.
PositionTimerMS=80
StatusWindowWidth=440
StatusWindowHeight=168
CaretGap=48
; All floating status and composition panels, including fixed-position mode.
; Default is 5000 ms (5 seconds).
; While the mouse is inside the panel, the current panel remains interactive.
; Whole-second setting. Valid range: 0-999000 ms (0-999 seconds).
; The Options slider remains 0-15 seconds; values above 15 are entered in the numeric box.
ModeStatusDurationMS=5000
; Associated-phrase/result panel duration. Default is 5000 ms (5 seconds).
; Uses the same 0-15 second slider plus 0-999 second numeric-box behavior.
RelatedPanelDurationMS=5000
PanelOpacityPercent=70
; true=dark settings and floating panels; false=light theme.
DarkMode=false
; Floating-panel font. Fresh configurations default to size 24. Supported sizes: 12, 16, 20, 24, 28, 32, 36, 40.
StatusFontName=Microsoft JhengHei UI
StatusChineseFontName=Microsoft JhengHei UI
StatusEnglishFontName=Segoe UI
StatusFontSize=24
; Candidate font weight: 600, 700, 800 (default).
CandidateFontWeight=800
; false=follow caret; floating panels prefer the lower-right of the text caret
; true=one remembered screen position for every input field; drag the panel to move it.
FixedStatusPosition=false
StatusFixedX=40
StatusFixedY=100

[Diagnostics]
; Legacy compatibility setting. The v0.10.394 native application reads ShamiGoCPP.ini for its current UI settings.
ShowStartupInstructions=false
; If true, Ctrl+Shift+F12 runs the compatibility checks used by test builds.
ValidationOnExit=false
